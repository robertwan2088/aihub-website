<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIHub 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
        
        /* 登录页 */
        .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%); }
        .login-box { background: #fff; padding: 40px; border-radius: 16px; width: 400px; max-width: 90%; }
        .login-box h2 { text-align: center; margin-bottom: 30px; }
        .login-box .form-group { margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .login-box button:hover { opacity: 0.9; }
        .login-error { color: #ef4444; text-align: center; margin-bottom: 16px; font-size: 14px; }
        
        /* 后台管理 */
        .admin-page { display: none; min-height: 100vh; }
        .admin-page.active { display: flex; }
        .admin-sidebar { width: 240px; background: #1a1a1a; padding: 20px 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
        .admin-logo { padding: 20px; color: #fff; font-size: 20px; font-weight: bold; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; }
        .admin-logo span { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .admin-menu { list-style: none; }
        .admin-menu li { padding: 12px 24px; color: rgba(255, 255, 255, 0.7); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .admin-menu li:hover, .admin-menu li.active { background: rgba(102, 126, 234, 0.2); color: #667eea; }
        .admin-content { margin-left: 240px; padding: 30px; width: calc(100% - 240px); min-height: 100vh; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .admin-title { font-size: 24px; font-weight: 600; }
        .admin-user { display: flex; align-items: center; gap: 10px; color: #666; }
        .admin-user button { padding: 6px 12px; background: #f0f0f0; border: none; border-radius: 4px; cursor: pointer; }
        .stats-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); }
        .stat-card h4 { color: #666; font-size: 14px; margin-bottom: 8px; }
        .stat-card .number { font-size: 32px; font-weight: 700; color: #333; }
        .data-table { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 16px; text-align: left; border-bottom: 1px solid #eee; }
        .data-table th { background: #f8f9fa; font-weight: 600; color: #666; }
        .data-table tr:hover { background: #f8f9fa; }
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
        .status-published { background: #d1fae5; color: #059669; }
        .status-draft { background: #fef3c7; color: #d97706; }
        .action-btn { padding: 6px 12px; border: none; background: #f0f0f0; border-radius: 6px; cursor: pointer; margin-right: 8px; font-size: 13px; transition: all 0.3s; }
        .action-btn:hover { background: #e0e0e0; }
        .action-btn.delete { color: #ef4444; }
        .action-btn.delete:hover { background: #fee2e2; }
        .add-btn { padding: 12px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        
        .content-section { display: none; }
        .content-section.active { display: block; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border-radius: 16px; padding: 30px; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .form-group textarea { height: 100px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel { padding: 10px 20px; border: 1px solid #ddd; background: #fff; border-radius: 8px; cursor: pointer; }
        .btn-save { padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        
        .loading { text-align: center; padding: 40px; color: #666; }
        
        @media (max-width: 1024px) { .stats-cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .admin-sidebar { display: none; }
            .admin-content { margin-left: 0; width: 100%; }
            .stats-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="loginPage" class="login-page">
        <div class="login-box">
            <h2>🔐 AIHub 后台登录</h2>
            <div id="loginError" class="login-error" style="display:none;"></div>
            <form id="loginForm">
                <div class="form-group"><label>用户名</label><input type="text" id="loginUsername" placeholder="请输入用户名" required></div>
                <div class="form-group"><label>密码</label><input type="password" id="loginPassword" placeholder="请输入密码" required></div>
                <button type="submit">登 录</button>
            </form>
            <p style="text-align:center;margin-top:16px;color:#999;font-size:12px;">默认账号: admin / admin123</p>
        </div>
    </div>
    
    <!-- 后台管理页 -->
    <div id="adminPage" class="admin-page">
        <div class="admin-sidebar">
            <div class="admin-logo"><span>AI</span>Hub 后台</div>
            <ul class="admin-menu">
                <li class="active" onclick="showSection('dashboard')">📈 数据概览</li>
                <li onclick="showSection('products')">📦 产品管理</li>
                <li onclick="showSection('news')">📰 新闻管理</li>
                <li onclick="showSection('leads')">👤 线索管理</li>
                <li onclick="showSection('settings')">⚙️ 系统设置</li>
            </ul>
        </div>
        
        <div class="admin-content">
            <!-- 数据概览 -->
            <div id="dashboard" class="content-section active">
                <div class="admin-header">
                    <h1 class="admin-title">数据概览</h1>
                    <div class="admin-user">👤 <span id="adminName">管理员</span> <button onclick="logout()">退出</button></div>
                </div>
                <div class="stats-cards">
                    <div class="stat-card"><h4>产品总数</h4><div class="number" id="statProducts">-</div></div>
                    <div class="stat-card"><h4>新闻总数</h4><div class="number" id="statNews">-</div></div>
                    <div class="stat-card"><h4>今日线索</h4><div class="number" id="statLeads">-</div></div>
                    <div class="stat-card"><h4>待处理</h4><div class="number" id="statPending">-</div></div>
                </div>
                <div class="admin-header"><h2 class="admin-title">最新线索</h2></div>
                <div class="data-table"><table><thead><tr><th>姓名</th><th>公司</th><th>联系方式</th><th>需求描述</th><th>提交时间</th><th>状态</th></tr></thead><tbody id="recentLeads"></tbody></table></div>
            </div>
            
            <!-- 产品管理 -->
            <div id="products" class="content-section">
                <div class="admin-header">
                    <h1 class="admin-title">产品管理</h1>
                    <button class="add-btn" onclick="openProductModal()">+ 新增产品</button>
                </div>
                <div class="data-table"><table><thead><tr><th>产品名称</th><th>分类</th><th>描述</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="productsTable"></tbody></table></div>
            </div>
            
            <!-- 新闻管理 -->
            <div id="news" class="content-section">
                <div class="admin-header">
                    <h1 class="admin-title">新闻管理</h1>
                    <button class="add-btn" onclick="openNewsModal()">+ 新增新闻</button>
                </div>
                <div class="data-table"><table><thead><tr><th>标题</th><th>分类</th><th>状态</th><th>发布时间</th><th>操作</th></tr></thead><tbody id="newsTable"></tbody></table></div>
            </div>
            
            <!-- 线索管理 -->
            <div id="leads" class="content-section">
                <div class="admin-header"><h1 class="admin-title">线索管理</h1></div>
                <div class="data-table"><table><thead><tr><th>姓名</th><th>公司</th><th>电话</th><th>邮箱</th><th>需求描述</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="leadsTable"></tbody></table></div>
            </div>
            
            <!-- 系统设置 -->
            <div id="settings" class="content-section">
                <div class="admin-header"><h1 class="admin-title">系统设置</h1></div>
                <div class="stat-card" style="max-width: 600px;">
                    <h3 style="margin-bottom: 20px;">基本信息</h3>
                    <div class="form-group"><label>公司名称</label><input type="text" id="settingSiteName"></div>
                    <div class="form-group"><label>联系邮箱</label><input type="email" id="settingEmail"></div>
                    <div class="form-group"><label>工作时间</label><input type="text" id="settingWorkTime"></div>
                    <div class="btn-group"><button class="btn-save" onclick="saveSettings()">保存设置</button></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 产品弹窗 -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="productModalTitle">新增产品</h3><button class="modal-close" onclick="closeModal('productModal')">&times;</button></div>
            <input type="hidden" id="productId">
            <div class="form-group"><label>产品名称</label><input type="text" id="productName" placeholder="请输入产品名称"></div>
            <div class="form-group"><label>分类</label><select id="productCategory"><option>大模型</option><option>Agent</option><option>RAG</option><option>工具</option><option>其他</option></select></div>
            <div class="form-group"><label>产品描述</label><textarea id="productDesc" placeholder="请输入产品描述"></textarea></div>
            <div class="form-group"><label>标签</label><input type="text" id="productTags" placeholder="多个标签用逗号分隔"></div>
            <div class="form-group"><label>演示视频链接</label><input type="text" id="productVideo" placeholder="请输入视频链接"></div>
            <div class="btn-group"><button class="btn-cancel" onclick="closeModal('productModal')">取消</button><button class="btn-save" onclick="saveProduct()">保存</button></div>
        </div>
    </div>
    
    <!-- 新闻弹窗 -->
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="newsModalTitle">新增新闻</h3><button class="modal-close" onclick="closeModal('newsModal')">&times;</button></div>
            <input type="hidden" id="newsId">
            <div class="form-group"><label>新闻标题</label><input type="text" id="newsTitle" placeholder="请输入新闻标题"></div>
            <div class="form-group"><label>分类</label><select id="newsCategory"><option>公司新闻</option><option>产品更新</option><option>合作动态</option><option>荣誉资质</option><option>技术分享</option></select></div>
            <div class="form-group"><label>新闻内容</label><textarea id="newsContent" placeholder="请输入新闻内容" style="height: 150px;"></textarea></div>
            <div class="btn-group"><button class="btn-cancel" onclick="closeModal('newsModal')">取消</button><button class="btn-save" onclick="saveNews()">保存</button></div>
        </div>
    </div>

    <script>
        const API = '/api';
        
        // 检查登录状态
        async function checkAuth() {
            try {
                const res = await fetch(`${API}/admin/check`);
                const data = await res.json();
                if (data.loggedIn) {
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('adminPage').classList.add('active');
                    document.getElementById('adminName').textContent = data.admin.username;
                    loadDashboard();
                }
            } catch (e) {
                console.error('检查登录状态失败', e);
            }
        }
        
        // 登录
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                const res = await fetch(`${API}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('adminPage').classList.add('active');
                    document.getElementById('adminName').textContent = data.admin.username;
                    loadDashboard();
                } else {
                    document.getElementById('loginError').textContent = data.error || '登录失败';
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('loginError').textContent = '网络错误，请重试';
                document.getElementById('loginError').style.display = 'block';
            }
        });
        
        // 登出
        async function logout() {
            await fetch(`${API}/admin/logout`, { method: 'POST' });
            location.reload();
        }
        
        // 切换内容区域
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.admin-menu li').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');
            
            if (sectionId === 'dashboard') loadDashboard();
            else if (sectionId === 'products') loadProducts();
            else if (sectionId === 'news') loadNews();
            else if (sectionId === 'leads') loadLeads();
            else if (sectionId === 'settings') loadSettings();
        }
        
        // 加载概览
        async function loadDashboard() {
            try {
                const res = await fetch(`${API}/admin/stats`);
                const data = await res.json();
                document.getElementById('statProducts').textContent = data.productsCount;
                document.getElementById('statNews').textContent = data.newsCount;
                document.getElementById('statLeads').textContent = data.leadsCount;
                document.getElementById('statPending').textContent = data.pendingLeads;
            } catch (e) {}
            loadRecentLeads();
        }
        
        async function loadRecentLeads() {
            try {
                const res = await fetch(`${API}/admin/leads`);
                const leads = await res.json();
                const tbody = document.getElementById('recentLeads');
                tbody.innerHTML = leads.slice(0, 5).map(l => `
                    <tr>
                        <td>${l.name}</td>
                        <td>${l.company || '-'}</td>
                        <td>${l.phone}</td>
                        <td>${l.description || '-'}</td>
                        <td>${formatDate(l.created_at)}</td>
                        <td><span class="status-badge ${l.status === '已处理' ? 'status-published' : 'status-draft'}">${l.status}</span></td>
                    </tr>
                `).join('');
            } catch (e) {}
        }
        
        // 产品管理
        async function loadProducts() {
            const res = await fetch(`${API}/admin/products`);
            const products = await res.json();
            const tbody = document.getElementById('productsTable');
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>${p.description || '-'}</td>
                    <td><span class="status-badge ${p.status ? 'status-published' : 'status-draft'}">${p.status ? '已发布' : '草稿'}</span></td>
                    <td>${formatDate(p.created_at)}</td>
                    <td><button class="action-btn" onclick="editProduct(${p.id})">编辑</button><button class="action-btn delete" onclick="deleteProduct(${p.id})">删除</button></td>
                </tr>
            `).join('');
        }
        
        function openProductModal(id = null) {
            document.getElementById('productId').value = id || '';
            document.getElementById('productModalTitle').textContent = id ? '编辑产品' : '新增产品';
            if (!id) {
                document.getElementById('productName').value = '';
                document.getElementById('productCategory').value = '其他';
                document.getElementById('productDesc').value = '';
                document.getElementById('productTags').value = '';
                document.getElementById('productVideo').value = '';
            }
            openModal('productModal');
        }
        
        async function editProduct(id) {
            const res = await fetch(`${API}/admin/products`);
            const products = await res.json();
            const p = products.find(x => x.id === id);
            if (p) {
                document.getElementById('productId').value = p.id;
                document.getElementById('productName').value = p.name;
                document.getElementById('productCategory').value = p.category;
                document.getElementById('productDesc').value = p.description || '';
                document.getElementById('productTags').value = p.tags || '';
                document.getElementById('productVideo').value = p.video_url || '';
                openProductModal(p.id);
            }
        }
        
        async function saveProduct() {
            const id = document.getElementById('productId').value;
            const data = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                description: document.getElementById('productDesc').value,
                tags: document.getElementById('productTags').value,
                video_url: document.getElementById('productVideo').value,
                status: 1
            };
            
            const url = id ? `${API}/admin/products/${id}` : `${API}/admin/products`;
            const method = id ? 'PUT' : 'POST';
            
            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            closeModal('productModal');
            loadProducts();
        }
        
        async function deleteProduct(id) {
            if (!confirm('确定要删除这个产品吗？')) return;
            await fetch(`${API}/admin/products/${id}`, { method: 'DELETE' });
            loadProducts();
        }
        
        // 新闻管理
        async function loadNews() {
            const res = await fetch(`${API}/admin/news`);
            const news = await res.json();
            const tbody = document.getElementById('newsTable');
            tbody.innerHTML = news.map(n => `
                <tr>
                    <td>${n.title}</td>
                    <td>${n.category}</td>
                    <td><span class="status-badge ${n.status ? 'status-published' : 'status-draft'}">${n.status ? '已发布' : '草稿'}</span></td>
                    <td>${formatDate(n.created_at)}</td>
                    <td><button class="action-btn" onclick="editNews(${n.id})">编辑</button><button class="action-btn delete" onclick="deleteNews(${n.id})">删除</button></td>
                </tr>
            `).join('');
        }
        
        function openNewsModal() {
            document.getElementById('newsId').value = '';
            document.getElementById('newsModalTitle').textContent = '新增新闻';
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsCategory').value = '公司新闻';
            document.getElementById('newsContent').value = '';
            openModal('newsModal');
        }
        
        async function editNews(id) {
            const res = await fetch(`${API}/admin/news`);
            const news = await res.json();
            const n = news.find(x => x.id === id);
            if (n) {
                document.getElementById('newsId').value = n.id;
                document.getElementById('newsModalTitle').textContent = '编辑新闻';
                document.getElementById('newsTitle').value = n.title;
                document.getElementById('newsCategory').value = n.category;
                document.getElementById('newsContent').value = n.content || '';
                openModal('newsModal');
            }
        }
        
        async function saveNews() {
            const id = document.getElementById('newsId').value;
            const data = {
                title: document.getElementById('newsTitle').value,
                category: document.getElementById('newsCategory').value,
                content: document.getElementById('newsContent').value,
                status: 1
            };
            
            const url = id ? `${API}/admin/news/${id}` : `${API}/admin/news`;
            const method = id ? 'PUT' : 'POST';
            
            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            closeModal('newsModal');
            loadNews();
        }
        
        async function deleteNews(id) {
            if (!confirm('确定要删除这条新闻吗？')) return;
            await fetch(`${API}/admin/news/${id}`, { method: 'DELETE' });
            loadNews();
        }
        
        // 线索管理
        async function loadLeads() {
            const res = await fetch(`${API}/admin/leads`);
            const leads = await res.json();
            const tbody = document.getElementById('leadsTable');
            tbody.innerHTML = leads.map(l => `
                <tr>
                    <td>${l.name}</td>
                    <td>${l.company || '-'}</td>
                    <td>${l.phone}</td>
                    <td>${l.email || '-'}</td>
                    <td>${l.description || '-'}</td>
                    <td>${formatDate(l.created_at)}</td>
                    <td><span class="status-badge ${l.status === '已处理' ? 'status-published' : 'status-draft'}">${l.status}</span></td>
                    <td>
                        <button class="action-btn" onclick="updateLeadStatus(${l.id}, '已处理')">处理</button>
                        <button class="action-btn delete" onclick="deleteLead(${l.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }
        
        async function updateLeadStatus(id, status) {
            await fetch(`${API}/admin/leads/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            loadLeads();
        }
        
        async function deleteLead(id) {
            if (!confirm('确定要删除这条线索吗？')) return;
            await fetch(`${API}/admin/leads/${id}`, { method: 'DELETE' });
            loadLeads();
        }
        
        // 设置管理
        async function loadSettings() {
            const res = await fetch(`${API}/settings`);
            const settings = await res.json();
            document.getElementById('settingSiteName').value = settings.site_name || '';
            document.getElementById('settingEmail').value = settings.contact_email || '';
            document.getElementById('settingWorkTime').value = settings.work_time || '';
        }
        
        async function saveSettings() {
            await fetch(`${API}/admin/settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    site_name: document.getElementById('settingSiteName').value,
                    contact_email: document.getElementById('settingEmail').value,
                    work_time: document.getElementById('settingWorkTime').value
                })
            });
            alert('设置已保存！');
        }
        
        // 工具函数
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function formatDate(d) { return d ? new Date(d).toLocaleString('zh-CN') : '-'; }
        
        document.querySelectorAll('.modal').forEach(m => {
            m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
        });
        
        // 初始化
        checkAuth();
    </script>
</body>
</html>
